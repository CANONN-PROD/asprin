<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download CTWT.bat</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 2.5rem;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      color: #ffffff;
      font-size: 1.5rem;
      margin-top: 0;
    }
    p {
      line-height: 1.5;
      color: #8b949e;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 6px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #2ea043;
    }
    .btn:disabled {
      background-color: #30363d;
      cursor: not-allowed;
    }
    .note {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CTWT.bat Launcher</h1>
    <p>Click the button below to download the Chris Titus Windows Utility batch launcher.</p>
    <button id="downloadBtn" class="btn" onclick="downloadFile()">Download CTWT.bat</button>
    <div id="status" class="note">
      Always pulls the latest version directly from GitHub.
    </div>
  </div>

  <script>
    async function downloadFile() {
      const btn = document.getElementById('downloadBtn');
      const status = document.getElementById('status');
      const rawUrl = 'https://raw.githubusercontent.com/CANONN-PROD/asprin/refs/heads/main/scramble.random/CTWT.bat';

      btn.disabled = true;
      btn.textContent = 'Downloading...';

      try {
        const response = await fetch(rawUrl);
        if (!response.ok) throw new Error('Network error');
        
        const text = await response.text();
        const blob = new Blob([text], { type: 'application/octet-stream' });
        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = 'CTWT.bat';
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

        btn.textContent = 'Downloaded!';
        status.textContent = 'Check your browser downloads folder for CTWT.bat.';
      } catch (err) {
        btn.textContent = 'Download Failed';
        status.innerHTML = 'Could not fetch file. <a href="' + rawUrl + '" style="color:#58a6ff;">Open raw file</a> and press Ctrl+S.';
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = 'Download CTWT.bat';
        }, 3000);
      }
    }
  </script>
</body>
</html>
